[package]
name = "ainput"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Local-first Windows voice input with optional OpenAI-compatible rewrite"
repository = "https://github.com/nakamotosai/ainput"
readme = "README.md"
keywords = ["voice", "asr", "sensevoice", "windows", "dictation"]
categories = ["multimedia::audio"]

[dependencies]
anyhow = "1"
arboard = "3.6.1"
cpal = "0.17.3"
ctrlc = "3.4.7"
hound = "3.5.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "=1.12.39"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
