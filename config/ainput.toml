[mode]
# Public product: local SenseVoice non-streaming only.
# streaming_asr / whisper_zh remain parseable but disabled.
default = "local_nonstreaming"

[hotkey]
voice_input = "CapsLock"
poll_ms = 8
activation_delay_ms = 200

[profiles.streaming]
enabled = false
mode = "streaming_asr"
hotkey = "Ctrl"
activation_delay_ms = 200
suppress_key = false

[profiles.whisper]
enabled = false
mode = "whisper_zh"
hotkey = "Alt+Z"
activation_delay_ms = 250
suppress_key = false

[profiles.local_nonstreaming]
enabled = true
mode = "local_nonstreaming"
hotkey = "CapsLock"
activation_delay_ms = 220
suppress_key = true

[asr]
endpoint_url = ""
chunk_ms = 100
release_grace_ms = 0
pre_roll_ms = 160
audio_ring_ms = 600
# 空闲多久（毫秒）没人用麦克风就暂停它，释放 usbaudio 电源请求、让系统能自动休眠。
# 0 = 从不暂停（保留常驻流，旧行为）。恢复是同一句柄 play()，亚毫秒，首音节不丢。
mic_idle_pause_ms = 30000
language = "zh-CN"
request_timeout_ms = 8000

[whisper]
endpoint_url = ""
sample_rate_hz = 16000
release_grace_ms = 0
min_audio_ms = 1800
min_rms_dbfs = -56.0
request_timeout_ms = 8000

[local_nonstreaming]
engine = "sense-voice"
model_dir = "models/sense-voice"
provider = "cpu"
sample_rate_hz = 16000
language = "auto"
use_itn = true  # 2026-09-14 用户实测 ITN 未吞数字，恢复模型自带 ITN；本地数字规则已旁路
punct_enabled = true  # 2026-09-03: 关 ITN 后模型不带标点了；离线标点模型补回
punct_model_dir = "models/punct"
# R23: 0 = auto (available parallelism clamped to [1, 8]); positive clamps to [1, 8].
num_threads = 0
release_grace_ms = 80
min_audio_ms = 800
min_rms_dbfs = -56.0
[rewrite]
enabled = false
streaming_enabled = false
dynamic_budget_enabled = true
compact_prompt_enabled = true
streaming_prewrite_enabled = false
prewrite_min_chars = 8
prewrite_stable_ms = 700
prewrite_debounce_ms = 900
prewrite_max_inflight = 1
# 每次 AI 改写附带最近 N 条听写历史作为对话上下文（0=关闭），
# 帮助模型正确判断人称/指代（如 姑姑→她）。
context_history_count = 6
mode = "after_release"
output_language = "chinese"
endpoint_url = ""
model = ""
fallback_models = []
api_key_env = "AINPUT_API_KEY"
api_key = ""
timeout_ms = 15000
debounce_ms = 260
min_chars = 4
max_output_chars = 256
temperature = 0.1
fallback_cooldown_ms = 60000

[prompt_studio]
enabled = false
mode = "during_hold"
endpoint_url = ""
model = ""
fallback_models = []
api_key_env = "AINPUT_API_KEY"
api_key = ""
timeout_ms = 8000
debounce_ms = 260
min_chars = 2
max_output_chars = 512
temperature = 0.1
fallback_cooldown_ms = 60000

[suspect_terms]
enabled = false
endpoint_url = ""
model = ""
fallback_models = []
api_key_env = "AINPUT_API_KEY"
api_key = ""
interval_ms = 300000
startup_delay_ms = 300000
history_limit = 80
min_records = 1
max_suggestions = 12
timeout_ms = 12000
temperature = 0.1
max_output_chars = 2048

[term_embeddings]
enabled = false
endpoint_url = ""
model = ""
fallback_models = []
api_key_env = "AINPUT_API_KEY"
api_key = ""
interval_ms = 300000
startup_delay_ms = 20000
history_limit = 120
max_items_per_run = 24
max_context_chars = 480
timeout_ms = 12000
prune_inactive_cache = true
family_min_variants = 2
family_similarity_threshold = 0.72
max_hotword_terms = 256

[output]
prefer_direct_paste = true
paste_stabilize_ms = 25
clipboard_policy = "retain_transcript"
clipboard_retry_count = 3
clipboard_retry_backoff_ms = 35
paste_preflight_recheck = true
replacement_preflight_recheck = true
# Process names (case-insensitive, ".exe" optional) to exempt from the built-in
# terminal safety skip in output.rs::is_terminal_process_name. Add wezterm-gui.exe
# so AI rewrite actually replaces ASR text in wezterm (default behavior skips
# all listed terminals, which wezterm-gui.exe is on).
rewrite_terminal_allowlist = ["wezterm-gui.exe"]

[hud]
style = "floating_text"
animation_theme = "minimal_pulse"
anchor = "taskbar_center"
expand_origin = "center"
offset_x_px = 0
offset_y_px = -6
width_px = 620
height_px = 46
min_width_px = 48
min_height_px = 46
min_text_width_px = 1
padding_x_px = 18
padding_y_px = 7
font_height_px = 26
auto_font_fit = true
font_weight = 600
font_family = "Microsoft YaHei UI"
text_align = "center"
text_color = "#FFFFFF"
text_alpha = 255
text_effect = "solid"
shadow_enabled = true
shadow_color = "#000000"
shadow_alpha = 160
shadow_offset_x_px = 1
shadow_offset_y_px = 1
rainbow_saturation_percent = 45
rainbow_lightness_percent = 78
rainbow_step_degree = 28
background_color = "#071014"
background_alpha = 0
corner_radius_px = 16
display_hold_ms = 650
